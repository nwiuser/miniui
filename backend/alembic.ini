[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
# prepend_sys_path = .

# timezone to use when generating the revision date.
# If not specified, the system timezone will be used.
# timezone =

# max length of characters to apply to the
# "version_path" functionality.
# max_filename_length = 255

# version table name to be used in the database.
version_table = alembic_version

# If set to 'True', the name of the version table
# is applied as a fallback when there is no explicit
# table name given.  Otherwise, the value is blank.
# version_table_schema =

# The signature of the migration scripts generated
# by revision() will be:
#   <rev>_<upgrade_tmpl>></rev>
# where:
#   <rev> is the revision marker (integer)
#   <upgrade_tmpl> is either 'u' or ' ' ' ') (u for upgrade)
#   <revised_rev> is the revision number of the prior revision
#   <revised_date> is the date (YYYY-MM-DD) of the prior revision
revision_environment = true

# The string literal to be printed between the
# "<rev>_<upgrade_tmpl>" and the "<revised_rev>_<revised_date>"
# examples:
#   revision_and_version = '-'
#   revision_and_version = '_'
#   revision_and_version = ''

# When multiple revision markers are used, although all but
# the first are parsed as integers, if the optional
# ">= 1000 separator" is not used, a "D" will be placed between
# each.  For example, with a value of 1000, a history of:
#   1-<rev1><rev2><rev3>
#   2-<rev1><rev2><rev3>
#   3-<rev1><rev2><rev3>
#   4-<rev1><rev2><rev3>
# becomes:
#   1-<rev1><rev2><rev3>
#   D-<rev2><rev3>
#   DD-<rev3>
#   DDD- (for rev4)
# version_path_separator = ''

# The ordering of the revision can be chosen similarly:
#   ' newestfirst' for descending (newer revisions first)
#   ' oldestfirst' for ascending (older revisions first)
# version_path_type =

# With Oracle and Oracle 10g, limit the size of the
# combination of a table and its associated LOB, VARRAY
# or nested table COLUMNS to 2GB.
# lob_fallback = False

# Output file for reformatting SQL statements.
# If not set, the defaults to stdout.
# sql_output_file =

# When generating a CHANGELOG, should tasks equal
# 'True' that both do not have prior versions and a
# revision that is not the immediate previous version
# note: as of ALembic 2.4, this option has no effect.
# exclude_links = False

# Output encoding for revision files.
# Default is UTF-8.
# output_encoding = UTF-8

# The timezone to use when processing dates.
# Defaults to the timezone of the server running Alembic.
# timezone =

# SQLAlchemy URL.
# The value here does not matter for the command line,
# as it is overridden by the command line argument.
# However, it does not hurt to have a sensible default here
# for when it is used programmatically.
sqlalchemy.url = postgresql://apexos_user:apexos_pass@localhost:5432/apexos

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(asctime)s %(message)s