version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: apexos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apexos
      POSTGRES_USER: apexos_user
      POSTGRES_PASSWORD: apexos_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

