services:
  postgres:
    image: postgres:15
    container_name: apexos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apexos}
      POSTGRES_USER: ${POSTGRES_USER:-apexos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apexos_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend service. Migrations run on startup (see backend/Dockerfile CMD).
  backend:
    build: ./backend
    container_name: apexos_backend
    restart: unless-stopped
    environment:
      # 'postgres' is the compose service name, not 'localhost'.
      DATABASE_URL: ${DATABASE_URL:-postgresql://apexos_user:apexos_pass@postgres:5432/apexos}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      METADATA_CACHE_TTL: ${METADATA_CACHE_TTL:-5.0}
      METADATA_CACHE_MAX_ENTRIES: ${METADATA_CACHE_MAX_ENTRIES:-64}
      # Set these once to create the first administrator on startup.
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Frontend service
  frontend:
    build: ./frontend
    container_name: apexos_frontend
    restart: unless-stopped
    environment:
      # Backend base URL as seen from the compose network (host 'backend', port 8000)
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
